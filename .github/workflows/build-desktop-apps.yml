name: build-desktop-apps

# Builds the double-click desktop app for macOS and Windows in the cloud, so no
# local Windows machine is needed. Run it from the repo's Actions tab
# (Run workflow), or it runs automatically when you push a tag like v1.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 = Apple Silicon (arm64) runner -> native Apple Silicon build.
          - os: macos-14
            artifact: InvoiceGSTRLinker-macOS-AppleSilicon
          - os: windows-latest
            artifact: InvoiceGSTRLinker-Windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # needed to attach the build to a GitHub Release on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tesseract (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Install tesseract (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract -y --no-progress

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # The org's OAuth client is kept out of git (Google auto-revokes clients
      # that GitHub's secret scanner finds), so the checkout has none and the
      # spec would quietly build a Drive-less app. Write it from the repo secret.
      - name: Write the Google OAuth client from the repo secret
        shell: bash
        env:
          CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
        run: |
          if [ -n "$CLIENT_SECRET_JSON" ]; then
            printf '%s' "$CLIENT_SECRET_JSON" > packaging/client_secret.json
            echo "wrote packaging/client_secret.json"
          else
            echo "::warning::GOOGLE_CLIENT_SECRET_JSON is not set — this build will have no Drive sign-in."
          fi

      - name: Build app
        run: pyinstaller packaging/InvoiceGSTRLinker.spec --noconfirm

      # The frozen bundle's own selftest fails when no OAuth client made it in.
      # Shipping a release that can't sign in to Drive is the failure a user
      # would hit first, so it is fatal on a tag and a warning otherwise.
      - name: Verify bundle (macOS)
        if: runner.os == 'macOS'
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: dist/InvoiceGSTRLinker/InvoiceGSTRLinker --selftest

      - name: Verify bundle (Windows)
        if: runner.os == 'Windows'
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          # Windowed exe: no stdout to inherit, so gate on the exit code.
          $p = Start-Process -FilePath dist\InvoiceGSTRLinker\InvoiceGSTRLinker.exe `
                             -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed ($($p.ExitCode)) — no bundled OAuth client?" }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r "../${{ matrix.artifact }}.zip" InvoiceGSTRLinker.app

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/InvoiceGSTRLinker/* -DestinationPath ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

      # On a v* tag, also publish the zip as a downloadable GitHub Release asset
      # so "install from GitHub tags" yields a real download (not just an
      # Actions artifact that expires and needs a login to fetch).
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.zip
