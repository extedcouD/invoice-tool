<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Invoices{% endblock %}</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --ink:#e6e9ef; --mut:#9aa4b2; --accent:#4f9cff; --ok:#3fb37f;
    --warn:#e8a13c; --bad:#e5605f; --info:#7c8cff;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  header{display:flex;gap:20px;align-items:center;padding:12px 20px;
    border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  header .brand{font-weight:700;letter-spacing:.3px}
  header nav a{color:var(--mut);margin-right:16px;font-weight:600}
  header nav a:hover{color:var(--ink)}
  header nav a.on{color:var(--ink)}
  .wrap{max-width:1200px;margin:0 auto;padding:22px 20px}
  h1{font-size:19px;margin:0 0 14px} h2{font-size:15px;margin:22px 0 10px;color:var(--mut)}
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card.recent-run{transition:border-color .15s}
  .card.recent-run:hover{border-color:var(--accent)}
  .card .k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .card .v{font-size:26px;font-weight:700;margin-top:4px}
  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--mut);text-transform:uppercase;font-size:11px;letter-spacing:.5px}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--panel2)}
  .mono{font-family:var(--mono)}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
  .pill.ok{background:rgba(63,179,127,.15);color:var(--ok)}
  .pill.warn{background:rgba(232,161,60,.15);color:var(--warn)}
  .pill.bad{background:rgba(229,96,95,.15);color:var(--bad)}
  .pill.info{background:rgba(124,140,255,.15);color:var(--info)}
  .bar{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden}
  .bar>span{display:block;height:100%;background:var(--accent);transition:width .3s}
  /* indeterminate: the corpus size isn't known until the walk finishes */
  .bar.indet>span{width:35%!important;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
  .muted{color:var(--mut)} .right{text-align:right}
  tr.hidden-row td{opacity:.5}
  .btn{display:inline-block;background:var(--accent);color:#04131f;font-weight:700;
    border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost.sel{border-color:var(--accent);color:var(--accent);font-weight:700}
  /* "Skip this supplier" is a supplier-level action, not the neutral row-level
     "Browse folders…" — give it an amber cast so the two never read as the same. */
  .btn.skip-supplier{border-color:rgba(232,161,60,.55);color:var(--warn);background:rgba(232,161,60,.08)}
  .btn.skip-supplier:hover{border-color:var(--warn);background:rgba(232,161,60,.16)}
  /* The one irreversible action in the app (rewrites the workbook, copies every
     matched PDF) must not read as just another primary button — same reasoning as
     .btn.skip-supplier above, reusing the same --warn token rather than a new color. */
  .btn.finish{background:var(--warn);color:#2b1400}
  .btn.finish:hover{background:#f0ac4c}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.big{padding:11px 20px;font-size:14px}
  .btn.sm{padding:5px 10px;font-size:12px}
  /* live activity feed */
  .feed{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px;
    background:var(--panel);font-family:var(--mono);font-size:12.5px}
  .feed .row{display:flex;gap:10px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line)}
  .feed .row:last-child{border-bottom:none}
  .feed .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--mut)}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
  .dot.bad{background:var(--bad)} .dot.info{background:var(--info)}
  .spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);
    border-top-color:var(--accent);display:inline-block;vertical-align:-2px;
    animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* a spinner that sits inside a button while its action is in flight */
  .spin.sm{width:11px;height:11px;border-width:2px;vertical-align:-1px;margin-right:4px}
  /* blocking overlay for the long job (the export) */
  #busy-ov{display:none;position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.72);
    align-items:center;justify-content:center}
  #busy-ov .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:20px 22px;width:min(440px,90vw)}
  .banner{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:600;
    background:rgba(63,179,127,.12);color:var(--ok);border:1px solid rgba(63,179,127,.4)}
  .banner.bad{background:rgba(229,96,95,.12);color:var(--bad);border:1px solid rgba(229,96,95,.4)}
  .banner.warn{background:rgba(232,161,60,.12);color:var(--warn);border:1px solid rgba(232,161,60,.4)}
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:7px;padding:7px 9px;font-size:13px;width:100%}
  label{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;margin:0 0 4px}
  /* a prominent search box — the reviewer lives in these, so they must not look
     like an afterthought input. Bigger, with a magnifier and a clear focus ring. */
  input.searchbar{font-size:15px;padding:12px 14px 12px 42px;border:1.5px solid var(--line);
    border-radius:10px;background-color:var(--panel2);background-repeat:no-repeat;
    background-position:15px center;background-size:17px;
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='24'%20height='24'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%239aa4b2'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Ccircle%20cx='11'%20cy='11'%20r='7'/%3E%3Cline%20x1='21'%20y1='21'%20x2='16.65'%20y2='16.65'/%3E%3C/svg%3E")}
  input.searchbar:focus{outline:none;border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(79,156,255,.18)}
  input.searchbar::placeholder{color:var(--mut)}
  /* pagination for the flat PDF browse */
  .pager{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:16px}
  .pager .info{color:var(--mut);font-size:13px}
  .flex{display:flex;gap:16px} .col{flex:1;min-width:0}
  /* tabs */
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:16px 0 0}
  .tabs a{padding:8px 14px;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;
    border-radius:6px 6px 0 0}
  .tabs a:hover{color:var(--ink);text-decoration:none;background:var(--panel)}
  .tabs a.on{color:var(--ink);border-bottom-color:var(--accent);background:var(--panel)}
  .tabs .n{font-size:11px;color:var(--mut);margin-left:5px}
  /* the run bar: keeps a live scan visible + controllable from every page */
  #runbar{display:none;align-items:center;gap:14px;padding:8px 20px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:49px;z-index:4;font-size:13px}
  #runbar .bar{flex:1;max-width:340px;min-width:120px}
  /* copy-to-clipboard button next to a transcribable value */
  .copybtn{background:transparent;border:1px solid var(--line);color:var(--mut);
    border-radius:5px;padding:0 6px;font-size:12px;line-height:1.7;cursor:pointer;
    vertical-align:middle;margin-left:4px}
  .copybtn:hover{color:var(--ink);border-color:var(--accent)}
  .copybtn.copied{color:var(--ok);border-color:var(--ok)}
  /* an editable field with a copy button that grabs its live value */
  .field-copy{display:flex;gap:4px;align-items:stretch}
  .field-copy input{flex:1;min-width:0}
  /* grouped rows tab: a supplier header, with its unmatched rows nested beneath.
     Extra vertical padding sets the supplier header apart from its rows. */
  .grouphead>td{background:var(--panel2);border-top:2px solid var(--line);
    padding-top:13px;padding-bottom:13px}
  /* the rows under a supplier are indented + carry a faint left rail, so they read
     as children of the supplier header directly above them. The whole row is a link
     to that row's "Find PDF" picker, so it takes a pointer + a hover-lit rail. */
  tr.datarow{cursor:pointer}
  tr.datarow>td:first-child{padding-left:30px;box-shadow:inset 3px 0 0 var(--line)}
  tr.datarow:hover>td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
  /* right-side PDF preview drawer + its backdrop */
  #pdf-back{position:fixed;inset:0;z-index:59;background:rgba(8,10,14,.45)}
  #pdf-drawer{position:fixed;top:0;right:0;bottom:0;width:min(52vw,720px);z-index:60;
    background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;
    box-shadow:-8px 0 24px rgba(0,0,0,.4)}
  /* an ID rule's display:flex outranks the [hidden] attribute, so it must be
     explicitly re-hidden or the drawer is stuck open and won't close. */
  #pdf-drawer[hidden],#pdf-back[hidden]{display:none}
  #pdf-drawer .dh{display:flex;align-items:center;gap:10px;padding:10px 14px;
    border-bottom:1px solid var(--line)}
  #pdf-drawer .dh b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:13px}
  #pdf-drawer embed{flex:1;width:100%;background:#fff}
</style>
</head>
<body>
<header>
  <span class="brand">📄 invoices</span>
  <nav>
    <a href="{{ url_for('home') }}" class="{{ 'on' if request.endpoint == 'home' }}">Home</a>
    <a href="{{ url_for('review') }}" class="{{ 'on' if request.endpoint in ('review','doc_detail','link_row') }}">Review queue</a>
    <a href="{{ url_for('dashboard') }}" class="{{ 'on' if request.endpoint == 'dashboard' }}">Dashboard</a>
  </nav>
</header>

<!-- Live run bar. Present on every page except home (which has the full live
     screen), so navigating away from a running scan no longer means losing sight
     of it — or the ability to pause/stop it. -->
{% if request.endpoint != 'home' %}
<div id="runbar">
  <span class="spin" id="rb-spin"></span>
  <span id="rb-phase">Scanning…</span>
  <div class="bar" id="rb-barwrap"><span id="rb-bar" style="width:0%"></span></div>
  <span class="muted mono" id="rb-text"></span>
  <span style="flex:1"></span>
  <button class="btn ghost sm" id="rb-pause" type="button">⏸ Pause</button>
  <button class="btn ghost sm" id="rb-stop" type="button">⏹ Stop</button>
</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const bar = $("runbar");
  let paused = false;
  let wasBusy = false;

  $("rb-pause").onclick = async () => {
    const r = await fetch(paused ? "/api/resume" : "/api/pause", {method:"POST"});
    await r.json();   // real state arrives on the next poll — never guess it here
  };
  $("rb-stop").onclick = async () => {
    $("rb-stop").disabled = true; $("rb-stop").textContent = "Stopping…";
    await fetch("/api/stop", {method:"POST"});
  };

  async function poll(){
    let s, rs;
    try{
      [s, rs] = await Promise.all([
        fetch("/status").then(r=>r.json()),
        fetch("/run_state").then(r=>r.json()),
      ]);
    }catch(e){ return setTimeout(poll, 1500); }   // transient — keep trying

    // No run in flight: hide the bar and STOP polling. A run can only be started
    // from the home page (a fresh page load), so there is nothing left to watch —
    // and /run_state recomputes summary() over every document, which is not
    // something to do every 2s forever on an idle tab holding a 50k-doc run.
    if(!rs.busy){
      bar.style.display = "none";
      // The scan just landed while we were sitting here: review is read-only during
      // a scan, so re-render to unlock it instead of stranding a stale page.
      if(wasBusy) location.reload();
      return;
    }
    wasBusy = true;
    bar.style.display = "flex";

    paused = !!s.paused;
    $("rb-pause").textContent = paused ? "▶ Resume" : "⏸ Pause";
    $("rb-spin").style.display = paused ? "none" : "inline-block";

    const discovering = !!s.discovering;
    $("rb-barwrap").classList.toggle("indet", discovering && !paused);
    if(!discovering) $("rb-bar").style.width = (s.pct||0) + "%";

    $("rb-phase").textContent =
      paused ? "Paused"
      : s.stopping ? "Stopping…"
      : rs.phase === "linking" ? "Linking to GSTR-2A…"
      : rs.phase === "finishing" ? "Finishing up — writing results…"
      : discovering ? "Finding PDFs…"
      : "Scanning…";
    $("rb-text").textContent = discovering
      ? (s.discovered||0).toLocaleString() + " found"
      : (s.done||0) + " / " + (s.total||0);

    setTimeout(poll, 700);
  }
  poll();
})();
</script>
{% endif %}

<!-- Blocking progress overlay for the long post-scan job (the export). It copies
     every matched invoice and rewrites the workbook, and running it inside the POST
     with no feedback was indistinguishable from the app being broken: you clicked,
     nothing happened, and everything else you clicked queued behind it. -->
<div id="busy-ov">
  <div class="box">
    <div class="flex" style="gap:12px;align-items:center">
      <span class="spin"></span>
      <b id="bo-title">Working…</b>
    </div>
    <div class="bar" id="bo-barwrap" style="margin:14px 0 8px"><span id="bo-bar" style="width:0%"></span></div>
    <div class="muted mono" id="bo-text"></div>
    <div class="banner bad" id="bo-err" style="display:none;margin-top:12px"></div>
    <div style="margin-top:14px;text-align:right">
      <button class="btn ghost sm" id="bo-close" type="button" style="display:none">Close</button>
    </div>
  </div>
</div>

<!-- A heavier confirmation than a plain confirm() — for the one genuinely
     irreversible action in the app, so it can show what's actually about to happen
     instead of a generic "are you sure?". Driven by UI.confirmModal(). -->
<div id="confirm-ov" style="display:none;position:fixed;inset:0;z-index:55;
     background:rgba(8,10,14,.72);align-items:center;justify-content:center">
  <div class="box" style="background:var(--panel);border:1px solid var(--line);
       border-radius:12px;padding:20px 22px;width:min(480px,90vw)">
    <b id="co-title" style="font-size:15px"></b>
    <div id="co-body" class="muted" style="margin-top:10px;line-height:1.6"></div>
    <div class="flex" style="gap:10px;justify-content:flex-end;margin-top:18px">
      <button class="btn ghost sm" id="co-cancel" type="button">Cancel</button>
      <button class="btn finish sm" id="co-ok" type="button"></button>
    </div>
  </div>
</div>

<!-- PDF preview drawer: confirm a candidate invoice visually without leaving the
     review queue. Reuses /pdf/<id>, which serves just the page for a page-invoice. -->
<div id="pdf-back" hidden></div>
<div id="pdf-drawer" hidden>
  <div class="dh">
    <button class="btn ghost sm" id="pdf-drawer-prev" type="button" title="Previous PDF (↑)">↑</button>
    <button class="btn ghost sm" id="pdf-drawer-next" type="button" title="Next PDF (↓)">↓</button>
    <b id="pdf-drawer-title">Preview</b>
    <button class="btn sm" id="pdf-drawer-bind" type="button" hidden>Bind to this row</button>
    <a class="btn ghost sm" id="pdf-drawer-open" target="_blank" rel="noopener">Open full ↗</a>
    <button class="btn ghost sm" id="pdf-drawer-close" type="button">Close ✕</button>
  </div>
  <embed id="pdf-drawer-embed" type="application/pdf">
</div>

<script>
// ---- shared UI helpers ----------------------------------------------------
// Every mutating action in this app can be slow (the export copies every matched
// invoice), so nothing may look inert after a click: buttons go busy, long jobs get
// a real progress bar.
window.UI = (function(){
  const $ = id => document.getElementById(id);
  const ov = $("busy-ov");

  function busy(btn, label){
    if(!btn) return () => {};
    const html = btn.innerHTML, dis = btn.disabled;
    btn.disabled = true;
    btn.innerHTML = `<span class="spin sm"></span> ${label || "Working…"}`;
    return () => { btn.disabled = dis; btn.innerHTML = html; };   // restore
  }

  // Disable a whole <form>'s submit button the moment it is submitted, so a slow
  // POST can't be fired twice by an impatient second click.
  //
  // Deferred to a task, not run inline: some of these forms are *also* guarded by a
  // delegated confirm() on document, which bubbles — so it runs AFTER this handler.
  // Arming inline would leave the button stuck on "Binding…" forever whenever the
  // user cancelled the confirm. By the next tick, defaultPrevented is the truth.
  function armForms(root){
    (root || document).querySelectorAll("form[data-busy]").forEach(f => {
      if(f.dataset.armed) return;
      f.dataset.armed = "1";
      f.addEventListener("submit", e => setTimeout(() => {
        if(e.defaultPrevented) return;          // a confirm() said no
        const b = f.querySelector("button[type=submit], button:not([type])");
        if(b) busy(b, f.dataset.busy || "Working…");
      }, 0));
    });
  }

  function showOverlay(title){
    $("bo-title").textContent = title;
    $("bo-err").style.display = "none";
    $("bo-close").style.display = "none";
    $("bo-bar").style.width = "0%";
    $("bo-text").textContent = "";
    $("bo-barwrap").classList.add("indet");
    ov.style.display = "flex";
  }
  function failOverlay(msg){
    $("bo-title").textContent = "That didn't work";
    $("bo-barwrap").classList.remove("indet");
    $("bo-err").textContent = msg;
    $("bo-err").style.display = "block";
    $("bo-close").style.display = "inline-block";
  }
  $("bo-close").onclick = () => { ov.style.display = "none"; };

  // POST a long job, then poll /api/task until it lands. onDone() runs on success;
  // a failure stays on screen with the reason instead of vanishing silently.
  async function runTask(url, {title, done}){
    showOverlay(title);
    try{
      const r = await fetch(url, {method:"POST"});
      const j = await r.json();
      if(!j.ok){ failOverlay(j.error || "Could not start."); return; }
    }catch(e){ failOverlay(String(e)); return; }

    for(;;){
      await new Promise(r => setTimeout(r, 600));
      let t;
      try{ t = await fetch("/api/task").then(r => r.json()); }
      catch(e){ continue; }                       // transient — keep polling

      if(t.total > 0){
        $("bo-barwrap").classList.remove("indet");
        $("bo-bar").style.width = Math.round(100 * t.done / t.total) + "%";
        $("bo-text").textContent = `${t.done.toLocaleString()} / ${t.total.toLocaleString()}`;
      }
      if(t.phase === "error"){ failOverlay(t.error || "Failed."); return; }
      if(t.phase === "done"){ done(); return; }
    }
  }

  // Reveal the run folder. The desktop bridge does it natively; the browser
  // fallback asks the server, which is the same machine anyway.
  async function openOutput(btn){
    const restore = busy(btn, "Opening…");
    try{
      if(window.pywebview && window.pywebview.api && window.pywebview.api.open_output){
        await window.pywebview.api.open_output();
      } else {
        const j = await fetch("/api/open_output", {method:"POST"}).then(r => r.json());
        if(!j.ok) alert(j.error + (j.path ? `\n\n${j.path}` : ""));
      }
    }catch(e){ alert(String(e)); }
    restore();
  }

  // This script runs before the page body exists, so nothing here may bind to a body
  // element directly: arm on DOMContentLoaded, and reach the open-output buttons by
  // delegation so they work wherever (and whenever) a page adds one.
  // (And never write a Jinja tag in these comments — Jinja parses the whole file.)
  document.addEventListener("DOMContentLoaded", () => armForms());
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest("[data-open-output]");
    if(b){ e.preventDefault(); openOutput(b); }
  });

  // A heavier confirm() — for the one truly irreversible action (Finish & export),
  // which used to get the exact same plain browser confirm() as a reversible click
  // like "skip this supplier". `body` may be HTML (e.g. real counts), not just text.
  // Resolves true/false; never throws, so the caller can always `if(await ...)`.
  const co = $("confirm-ov");
  function confirmModal({title, body, okLabel}){
    return new Promise(resolve => {
      $("co-title").textContent = title || "Are you sure?";
      $("co-body").innerHTML = body || "";
      $("co-ok").textContent = okLabel || "Confirm";
      co.style.display = "flex";
      const done = ok => { co.style.display = "none"; cleanup(); resolve(ok); };
      const onOk = () => done(true), onCancel = () => done(false);
      const onKey = e => { if(e.key === "Escape") done(false); };
      function cleanup(){
        $("co-ok").removeEventListener("click", onOk);
        $("co-cancel").removeEventListener("click", onCancel);
        document.removeEventListener("keydown", onKey);
      }
      $("co-ok").addEventListener("click", onOk);
      $("co-cancel").addEventListener("click", onCancel);
      document.addEventListener("keydown", onKey);
    });
  }

  return {busy, runTask, openOutput, armForms, confirmModal};
})();
</script>

<script>
// ---- clipboard + PDF preview + the shared candidate-row renderer -----------
// One implementation of "here is a PDF you can bind", used by the standalone
// picker page (link_row) — its search, browse and near-miss tabs all render rows
// through here, so a bind behaves identically wherever it is triggered.
window.LINK = (function(){
  const esc = s => (s == null ? "" : String(s)).replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // Clipboard, delegated over [data-copy]. navigator.clipboard needs a secure
  // context (localhost qualifies), but the desktop webview can still block it, so
  // fall back to a hidden-textarea execCommand copy. This is the reliable way to
  // copy a field value in the native window, which has no right-click "Copy".
  function copyText(t){
    if(navigator.clipboard && navigator.clipboard.writeText)
      return navigator.clipboard.writeText(t).catch(() => execCopy(t));
    return execCopy(t);
  }
  function execCopy(t){
    try{
      const ta = document.createElement("textarea");
      ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand("copy"); document.body.removeChild(ta);
    }catch(e){}
    return Promise.resolve();
  }
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest("[data-copy], [data-copy-prev]");
    if(!b) return;
    e.preventDefault(); e.stopPropagation();
    // data-copy-prev copies the immediately-preceding field's LIVE value (so an
    // edited invoice number copies what's on screen, not the parsed original).
    let text = b.getAttribute("data-copy");
    if(b.hasAttribute("data-copy-prev")){
      const inp = b.previousElementSibling;
      text = inp ? ("value" in inp ? inp.value : inp.textContent) : "";
    }
    copyText(text || "").then(() => {
      b.classList.add("copied"); const o = b.textContent; b.textContent = "✓";
      setTimeout(() => { b.classList.remove("copied"); b.textContent = o; }, 900);
    });
  });

  // PDF preview drawer.
  const drawer = document.getElementById("pdf-drawer");
  const back = document.getElementById("pdf-back");
  const emb = document.getElementById("pdf-drawer-embed");
  const bindBtn = document.getElementById("pdf-drawer-bind");
  const prevBtn = document.getElementById("pdf-drawer-prev");
  const nextBtn = document.getElementById("pdf-drawer-next");
  // The [data-preview] button behind the currently open preview — lets ↑/↓ and
  // the drawer's own Bind button reach back into the row that opened it, without
  // keeping a separate list of ids that would go stale the moment a search or
  // page changes what's on screen.
  let previewBtn = null;

  // Every [data-preview] in the same table as `previewBtn`, in on-screen order —
  // i.e. whatever list you're currently looking at (search hits, one browse
  // folder, one page of Browse PDFs). Re-queried on every step so a table that
  // re-rendered while the drawer was open (a new search landing, say) is picked
  // up rather than navigating a stale list.
  function previewList(){
    const table = previewBtn && previewBtn.closest("table");
    return table ? Array.from(table.querySelectorAll("[data-preview]")) : [];
  }

  // The row's actual Bind form, found by shape (a hidden doc_id input) rather
  // than a fixed selector — the near-matches, search/browse/all and "my
  // bindings" tabs all build this row differently, but only a bindable row
  // (not an already-bound "Undo" row) carries this input.
  function findBindForm(btn){
    const tr = btn && btn.closest("tr");
    if(!tr) return null;
    for(const f of tr.querySelectorAll("form")){
      if(f.querySelector('input[name="doc_id"]')) return f;
    }
    return null;
  }

  function refreshDrawerNav(){
    const list = previewList();
    const multi = list.length > 1;
    prevBtn.hidden = nextBtn.hidden = !multi;
    const form = findBindForm(previewBtn);
    bindBtn.hidden = !form;
    // Submitting the row's own <form> (rather than re-implementing bind here)
    // means the drawer's button gets the exact same not-an-invoice confirm and
    // busy-state handling as every other Bind button, for free.
    bindBtn.onclick = form ? () => form.requestSubmit() : null;
  }

  function openPreview(id, label, btn){
    if(btn) previewBtn = btn;
    document.getElementById("pdf-drawer-title").textContent = label || "Preview";
    document.getElementById("pdf-drawer-open").href = "/doc/" + encodeURIComponent(id);
    emb.setAttribute("src", "/pdf/" + encodeURIComponent(id));
    drawer.hidden = false; back.hidden = false;
    refreshDrawerNav();
  }
  function closePreview(){
    drawer.hidden = true; back.hidden = true; emb.removeAttribute("src");
    previewBtn = null; bindBtn.hidden = true; bindBtn.onclick = null;
  }
  function stepPreview(dir){
    const list = previewList();
    if(!list.length) return;
    let i = list.indexOf(previewBtn);
    i = ((i === -1 ? 0 : i) + dir + list.length) % list.length;
    const next = list[i];
    next.scrollIntoView({block: "nearest"});
    openPreview(next.getAttribute("data-preview"), next.getAttribute("data-label"), next);
  }
  if(drawer){
    document.getElementById("pdf-drawer-close").onclick = closePreview;
    back.onclick = closePreview;
    prevBtn.onclick = () => stepPreview(-1);
    nextBtn.onclick = () => stepPreview(1);
    document.addEventListener("keydown", e => {
      if(drawer.hidden) return;
      if(e.key === "Escape"){ closePreview(); return; }
      // Don't steal arrow keys from a focused text input (e.g. the search box
      // behind the drawer) — only navigate when nothing is being typed into.
      const t = e.target && e.target.tagName;
      if(t === "INPUT" || t === "TEXTAREA") return;
      if(e.key === "ArrowDown"){ e.preventDefault(); stepPreview(1); }
      else if(e.key === "ArrowUp"){ e.preventDefault(); stepPreview(-1); }
    });
    document.addEventListener("click", e => {
      const b = e.target.closest && e.target.closest("[data-preview]");
      if(b){ e.preventDefault(); openPreview(b.getAttribute("data-preview"), b.getAttribute("data-label"), b); }
    });
  }

  // Amount shown next to the row's own invoice value, so a reviewer can match on
  // it by eye. Blank (not "0.00") when the extractor never found a total.
  const money = v => (v == null || v === "") ? "—"
    : Number(v).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});

  // One candidate row. A PDF the classifier didn't call an invoice is still
  // bindable (often *why* the row went unmatched), but it must say so first.
  function rowHtml(h, row){
    const bind = "/link/row/" + row + "/bind";
    const conf = h.confidence < 0.6 ? "bad" : h.confidence < 0.8 ? "warn" : "ok";
    const warn = h.is_invoice ? "" :
      `<span class="pill warn" title="the scan classified this as '${esc(h.doc_type)}'. Binding it marks it an invoice.">not an invoice</span>`;
    const taken = (h.gstr_row && h.gstr_row !== row)
      ? `<span class="pill info" title="already satisfies B2B row ${h.gstr_row}">row ${h.gstr_row}</span>` : "";
    const score = h.score ? `<span class="pill ${h.score>=85?"ok":h.score>=70?"warn":"info"}">${Math.round(h.score)}%</span>` : "";
    const hiddenPill = h.hidden ? `<span class="pill info">hidden</span>` : "";
    return `<tr class="${h.hidden ? "hidden-row" : ""}">
      <td class="mono">${esc(h.invoice_id || h.filename)}<div class="muted" style="font-size:11.5px">${esc(h.folder || "—")}</div></td>
      <td class="mono muted">${esc(h.gstin || "—")}</td>
      <td class="muted">${esc(h.date || "—")}</td>
      <td class="mono muted right">${money(h.amount)}</td>
      <td class="muted">${esc(h.vendor || h.company || "—")}</td>
      <td><span class="pill ${conf}">${h.confidence.toFixed(2)}</span> ${warn} ${taken} ${hiddenPill}</td>
      <td>${score}</td>
      <td class="right" style="white-space:nowrap">
        <button class="btn ghost sm" type="button" data-preview="${esc(h.id)}" data-label="${esc(h.invoice_id || h.filename)}">Preview</button>
        <button class="btn ghost sm hide-toggle" type="button" data-doc-id="${esc(h.id)}"
                data-hidden="${h.hidden ? "1" : "0"}">${h.hidden ? "Unhide" : "Hide"}</button>
        <form method="post" action="${bind}" style="display:inline" data-busy="Binding…"
              data-confirm="${h.is_invoice ? "" : esc(h.filename)}">
          <input type="hidden" name="doc_id" value="${esc(h.id)}">
          <button class="btn sm" type="submit">Bind</button>
        </form>
      </td></tr>`;
  }

  // Hide/unhide a PDF from the link finder (search/browse/content-search tabs).
  // Doesn't touch the match or classification — purely search visibility — so a
  // click just flips it and patches this one row, no reload, no rematch.
  document.addEventListener("click", e => {
    const b = e.target.closest && e.target.closest(".hide-toggle");
    if(!b) return;
    e.preventDefault();
    const id = b.getAttribute("data-doc-id");
    const on = b.getAttribute("data-hidden") !== "1";
    const tr = b.closest("tr");
    b.disabled = true;
    fetch("/api/doc/" + encodeURIComponent(id) + "/hide", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({on})
    }).then(r => r.json()).then(res => {
      b.disabled = false;
      if(!res.ok){ alert(res.error || "Could not update."); return; }
      const showHidden = document.getElementById("show-hidden");
      if(on && !(showHidden && showHidden.checked)){ tr.remove(); return; }
      b.setAttribute("data-hidden", on ? "1" : "0");
      b.textContent = on ? "Unhide" : "Hide";
      tr.classList.toggle("hidden-row", on);
    }).catch(e => { b.disabled = false; alert("Could not update: " + e); });
  });
  const HEADER = `<tr><th>file / folder</th><th>GSTIN</th><th>date</th><th class="right">amount</th>
      <th>vendor</th><th>status</th><th>match</th><th></th></tr>`;
  function resultsTable(hits, row){
    return hits.length
      ? `<table>${HEADER}${hits.map(h => rowHtml(h, row)).join("")}</table>`
      : `<div class="card"><span class="pill info">nothing here</span> No PDF matches.</div>`;
  }

  // Bind-confirm for a non-invoice pick, delegated once for every JS-built Bind
  // form (an apostrophe in a filename would break an inline onsubmit). Runs before
  // UI.armForms (which is deferred a tick and checks defaultPrevented).
  document.addEventListener("submit", e => {
    const name = e.target.dataset && e.target.dataset.confirm;
    if(!name) return;
    const m = e.target.action && e.target.action.match(/\/link\/row\/(\d+)\/bind/);
    if(!confirm(`${name} was not detected as an invoice. Bind it${m ? " to B2B row " + m[1] : ""} and treat it as one?`))
      e.preventDefault();
  });

  return {esc, rowHtml, resultsTable, HEADER, openPreview, copyText};
})();
</script>

<div class="wrap">{% block body %}{% endblock %}</div>
</body>
</html>
