<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Invoices{% endblock %}</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --ink:#e6e9ef; --mut:#9aa4b2; --accent:#4f9cff; --ok:#3fb37f;
    --warn:#e8a13c; --bad:#e5605f; --info:#7c8cff;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  header{display:flex;gap:20px;align-items:center;padding:12px 20px;
    border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
  header .brand{font-weight:700;letter-spacing:.3px}
  header nav a{color:var(--mut);margin-right:16px;font-weight:600}
  header nav a:hover{color:var(--ink)}
  header nav a.on{color:var(--ink)}
  .wrap{max-width:1200px;margin:0 auto;padding:22px 20px}
  h1{font-size:19px;margin:0 0 14px} h2{font-size:15px;margin:22px 0 10px;color:var(--mut)}
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card .k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .card .v{font-size:26px;font-weight:700;margin-top:4px}
  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}
  th{color:var(--mut);text-transform:uppercase;font-size:11px;letter-spacing:.5px}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--panel2)}
  .mono{font-family:var(--mono)}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
  .pill.ok{background:rgba(63,179,127,.15);color:var(--ok)}
  .pill.warn{background:rgba(232,161,60,.15);color:var(--warn)}
  .pill.bad{background:rgba(229,96,95,.15);color:var(--bad)}
  .pill.info{background:rgba(124,140,255,.15);color:var(--info)}
  .bar{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden}
  .bar>span{display:block;height:100%;background:var(--accent);transition:width .3s}
  /* indeterminate: the corpus size isn't known until the walk finishes */
  .bar.indet>span{width:35%!important;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
  .muted{color:var(--mut)} .right{text-align:right}
  .btn{display:inline-block;background:var(--accent);color:#04131f;font-weight:700;
    border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost.sel{border-color:var(--accent);color:var(--accent);font-weight:700}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.big{padding:11px 20px;font-size:14px}
  .btn.sm{padding:5px 10px;font-size:12px}
  /* live activity feed */
  .feed{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px;
    background:var(--panel);font-family:var(--mono);font-size:12.5px}
  .feed .row{display:flex;gap:10px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line)}
  .feed .row:last-child{border-bottom:none}
  .feed .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--mut)}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}
  .dot.bad{background:var(--bad)} .dot.info{background:var(--info)}
  .spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);
    border-top-color:var(--accent);display:inline-block;vertical-align:-2px;
    animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .banner{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:600;
    background:rgba(63,179,127,.12);color:var(--ok);border:1px solid rgba(63,179,127,.4)}
  .banner.bad{background:rgba(229,96,95,.12);color:var(--bad);border:1px solid rgba(229,96,95,.4)}
  .banner.warn{background:rgba(232,161,60,.12);color:var(--warn);border:1px solid rgba(232,161,60,.4)}
  input,select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:7px;padding:7px 9px;font-size:13px;width:100%}
  label{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;margin:0 0 4px}
  .flex{display:flex;gap:16px} .col{flex:1;min-width:0}
  /* tabs */
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:16px 0 0}
  .tabs a{padding:8px 14px;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;
    border-radius:6px 6px 0 0}
  .tabs a:hover{color:var(--ink);text-decoration:none;background:var(--panel)}
  .tabs a.on{color:var(--ink);border-bottom-color:var(--accent);background:var(--panel)}
  .tabs .n{font-size:11px;color:var(--mut);margin-left:5px}
  /* the run bar: keeps a live scan visible + controllable from every page */
  #runbar{display:none;align-items:center;gap:14px;padding:8px 20px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:49px;z-index:4;font-size:13px}
  #runbar .bar{flex:1;max-width:340px;min-width:120px}
</style>
</head>
<body>
<header>
  <span class="brand">📄 invoices</span>
  <nav>
    <a href="{{ url_for('home') }}" class="{{ 'on' if request.endpoint == 'home' }}">Home</a>
    <a href="{{ url_for('review') }}" class="{{ 'on' if request.endpoint in ('review','doc_detail','link_row') }}">Review queue</a>
    <a href="{{ url_for('dashboard') }}" class="{{ 'on' if request.endpoint == 'dashboard' }}">Dashboard</a>
  </nav>
</header>

<!-- Live run bar. Present on every page except home (which has the full live
     screen), so navigating away from a running scan no longer means losing sight
     of it — or the ability to pause/stop it. -->
{% if request.endpoint != 'home' %}
<div id="runbar">
  <span class="spin" id="rb-spin"></span>
  <span id="rb-phase">Scanning…</span>
  <div class="bar" id="rb-barwrap"><span id="rb-bar" style="width:0%"></span></div>
  <span class="muted mono" id="rb-text"></span>
  <span style="flex:1"></span>
  <button class="btn ghost sm" id="rb-pause" type="button">⏸ Pause</button>
  <button class="btn ghost sm" id="rb-stop" type="button">⏹ Stop</button>
</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const bar = $("runbar");
  let paused = false;
  let wasBusy = false;

  $("rb-pause").onclick = async () => {
    const r = await fetch(paused ? "/api/resume" : "/api/pause", {method:"POST"});
    await r.json();   // real state arrives on the next poll — never guess it here
  };
  $("rb-stop").onclick = async () => {
    $("rb-stop").disabled = true; $("rb-stop").textContent = "Stopping…";
    await fetch("/api/stop", {method:"POST"});
  };

  async function poll(){
    let s, rs;
    try{
      [s, rs] = await Promise.all([
        fetch("/status").then(r=>r.json()),
        fetch("/run_state").then(r=>r.json()),
      ]);
    }catch(e){ return setTimeout(poll, 1500); }   // transient — keep trying

    // No run in flight: hide the bar and STOP polling. A run can only be started
    // from the home page (a fresh page load), so there is nothing left to watch —
    // and /run_state recomputes summary() over every document, which is not
    // something to do every 2s forever on an idle tab holding a 50k-doc run.
    if(!rs.busy){
      bar.style.display = "none";
      // The scan just landed while we were sitting here: review is read-only during
      // a scan, so re-render to unlock it instead of stranding a stale page.
      if(wasBusy) location.reload();
      return;
    }
    wasBusy = true;
    bar.style.display = "flex";

    paused = !!s.paused;
    $("rb-pause").textContent = paused ? "▶ Resume" : "⏸ Pause";
    $("rb-spin").style.display = paused ? "none" : "inline-block";

    const discovering = !!s.discovering;
    $("rb-barwrap").classList.toggle("indet", discovering && !paused);
    if(!discovering) $("rb-bar").style.width = (s.pct||0) + "%";

    $("rb-phase").textContent =
      paused ? "Paused"
      : s.stopping ? "Stopping…"
      : rs.phase === "linking" ? "Linking to GSTR-2A…"
      : rs.phase === "finishing" ? "Finishing up — writing results…"
      : discovering ? "Finding PDFs…"
      : "Scanning…";
    $("rb-text").textContent = discovering
      ? (s.discovered||0).toLocaleString() + " found"
      : (s.done||0) + " / " + (s.total||0);

    setTimeout(poll, 700);
  }
  poll();
})();
</script>
{% endif %}

<div class="wrap">{% block body %}{% endblock %}</div>
</body>
</html>
